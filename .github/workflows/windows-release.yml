name: Windows C++ Qt portable

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Qt SDK
        shell: pwsh
        run: ./install-qt.ps1
      - name: Build C++ application and portable folder
        shell: cmd
        run: call build-qt.cmd "%CD%\.deps\qt"
      - name: Build single-file portable executable
        shell: pwsh
        run: ./build-portable.ps1
      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/qt/* -DestinationPath dist/TeamSpeakAudioControl-windows-x64.zip -CompressionLevel Optimal
          @('TeamSpeakAudioControl-windows-x64.zip', 'TeamSpeakAudioControl-portable.exe') | ForEach-Object {
            $hash = (Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeamSpeakAudioControl-windows-x64
          path: |
            dist/TeamSpeakAudioControl-windows-x64.zip
            dist/TeamSpeakAudioControl-portable.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TeamSpeakAudioControl-windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "TeamSpeak Audio Control $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/TeamSpeakAudioControl-windows-x64.zip release/TeamSpeakAudioControl-portable.exe release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
