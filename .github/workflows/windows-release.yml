name: Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build native mixer
        shell: cmd
        run: call build-native.cmd
      - name: Package standalone executable
        run: python -m PyInstaller --noconfirm --clean TeamSpeakAudioControl.spec
      - name: Check packaged application outside the source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkDir = Join-Path $env:RUNNER_TEMP 'packaged-app-check'
          New-Item -ItemType Directory -Force $checkDir | Out-Null
          $exe = Join-Path $checkDir 'TeamSpeakAudioControl.exe'
          Copy-Item dist/TeamSpeakAudioControl.exe $exe
          $report = Join-Path $checkDir 'diagnostics.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnose', "`"$report`"") -WorkingDirectory $checkDir -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged application diagnostic timed out'
          }
          if (-not (Test-Path $report)) { throw 'No diagnostic report was produced' }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $result.ok) { throw 'Packaged application diagnostic failed' }
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TeamSpeakAudioControl.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TeamSpeakAudioControl.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeamSpeakAudioControl-windows-x64
          path: |
            dist/TeamSpeakAudioControl.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TeamSpeakAudioControl-windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "TeamSpeak Audio Control $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/TeamSpeakAudioControl.exe release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
